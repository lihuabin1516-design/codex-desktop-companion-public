[package]
name = "coordination-store"
version = "0.1.0-beta.3"
edition = "2021"
license = "MIT"
description = "SQLite store and transactional outbox for Codex + CC-Panes Coordination Plane"

[dependencies]
coordination-core = { path = "../coordination-core" }
hex = "0.4.3"
rusqlite = { version = "0.41.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
