[package]
name = "coordinator"
version = "0.1.0-beta.3"
edition = "2021"
license = "MIT"
description = "Coordinator runtime contract for Codex + PaneForge Coordination Plane"

[lib]
name = "coordination_coordinator"
path = "src/lib.rs"

[[bin]]
name = "codex-paneforge-coordinator"
path = "src/main.rs"

[dependencies]
paneforge-adapter = { path = "../paneforge-adapter" }
coordination-core = { path = "../coordination-core" }
coordination-protocol = { path = "../coordination-protocol" }
coordination-store = { path = "../coordination-store" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
