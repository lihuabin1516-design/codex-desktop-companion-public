[package]
name = "coordination-mcp"
version = "0.1.0-beta.3"
edition = "2021"
license = "MIT"
description = "stdio MCP server for Codex + CC-Panes Coordination Plane"

[lib]
name = "coordination_mcp"
path = "src/lib.rs"

[[bin]]
name = "codex-ccpanes-mcp"
path = "src/main.rs"

[dependencies]
coordination-core = { path = "../coordination-core" }
coordination-protocol = { path = "../coordination-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
ccpanes-adapter = { path = "../ccpanes-adapter" }
coordinator = { path = "../coordinator" }
coordination-store = { path = "../coordination-store" }
tempfile = "3.27.0"
