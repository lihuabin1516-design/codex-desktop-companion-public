name: Codex CC-Panes Companion

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-production-gates:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}\codex-ccpanes-target
      RELEASE_OUTPUT_ROOT: ${{ runner.temp }}\codex-ccpanes-release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release package
        run: .\scripts\build-release.ps1 -CargoTargetDir $env:CARGO_TARGET_DIR -OutputRoot $env:RELEASE_OUTPUT_ROOT

      - name: Verify package
        run: |
          $package = Get-ChildItem $env:RELEASE_OUTPUT_ROOT -Directory -Filter "CodexCCPanes-*-win-x64" |
            Select-Object -First 1
          .\scripts\verify-package.ps1 -PackageRoot $package.FullName
          .\scripts\test-installer.ps1 -PackageRoot $package.FullName
